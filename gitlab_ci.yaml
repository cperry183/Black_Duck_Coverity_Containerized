name: Build & Push Coverity Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - "cov-analysis-linux64-*.sh"
      - "license.dat"
      - ".github/workflows/coverity-build.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/coverity

jobs:
  build-and-push:
    name: Build & push multi-stage Coverity image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Verify required installer artifacts are present ──────────────────
      - name: Check required build artifacts
        run: |
          set -e
          VERSION=$(grep 'ARG VERSION' Dockerfile | head -1 | cut -d= -f2)
          echo "Coverity version: ${VERSION}"
          echo "COVERITY_VERSION=${VERSION}" >> "${GITHUB_ENV}"

          if [[ ! -f "cov-analysis-linux64-${VERSION}.sh" ]]; then
            echo "::error::Installer cov-analysis-linux64-${VERSION}.sh not found"
            exit 1
          fi
          if [[ ! -f "license.dat" ]]; then
            echo "::error::license.dat not found"
            exit 1
          fi

      # ── QEMU + Buildx for multi-platform support (optional, safe to keep) ─
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to GHCR ─────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive image tags and OCI labels ────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag with Coverity version (e.g. 2020.12)
            type=raw,value=${{ env.COVERITY_VERSION }}
            # tag with short git SHA for traceability
            type=sha,prefix=sha-,format=short
            # rolling 'latest' on default branch
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build & push ─────────────────────────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.COVERITY_VERSION }}
          # Layer cache backed by GHCR — no extra cache service needed
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          provenance: true   # SLSA provenance attestation
          sbom: true         # SBOM attestation

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        if: success()
        run: |
          echo "## ✅ Coverity image published" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Field | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|-------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Coverity version | \`${{ env.COVERITY_VERSION }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Commit | \`${{ github.sha }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> "${GITHUB_STEP_SUMMARY}"
